<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gourmet Express</title>
    <link rel="stylesheet" href="style.css">
</head>
<div id="checkout-modal" class="modal">
    <div class="modal-content">
        <h2>Confirm Order</h2>
        
        <!-- Tanlangan taomlar ro'yxati va umumiy summa -->
        <div id="order-summary-list"></div>
        <hr style="margin: 15px 0; border: 0; border-top: 1px solid #eee;">
        
        <div class="input-group">
            <label>Table Number:</label>
            <input type="number" id="table-number" placeholder="e.g. 4">
        </div>

        <div class="input-group">
            <label>Payment Method:</label>
            <select id="payment-method" style="width: 100%; padding: 14px; border-radius: 12px; border: 1px solid #ddd; background: #f9f9f9;">
                <option value="Cash">Cash</option>
                <option value="Card">Card / Terminal</option>
            </select>
        </div>

        <div class="modal-actions">
            <button class="btn-secondary" onclick="closeModal()">Back</button>
            <button class="btn-primary" onclick="submitOrder()">Send Order</button>
        </div>
    </div>
</div>
<body>
    <div class="app-container">
        <!-- Header -->
        <header>
            <h1>GOURMET EXPRESS</h1>
            <div class="search-box">
                <input type="text" id="search-input" placeholder="Search for food...">
            </div>
        </header>

        <!-- Categories -->
        <nav class="categories" id="category-list">
            <button class="cat-btn active" onclick="filterMenu('All')">All</button>
            <button class="cat-btn" onclick="filterMenu('Pizzas')">Pizzas</button>
            <button class="cat-btn" onclick="filterMenu('Burgers')">Burgers</button>
            <button class="cat-btn" onclick="filterMenu('Drinks')">Drinks</button>
        </nav>

        <!-- Menu Grid -->
        <main class="menu-grid" id="menu-container">
            <!-- JavaScript will load items here -->
        </main>

        <!-- Footer Cart Bar -->
        <footer class="cart-bar">
            <div class="cart-text">
                <small>Cart:</small>
                <div id="cart-count">0 items</div>
            </div>
            <button class="order-btn" onclick="openModal()">Order Now</button>
        </footer>
    </div>

    <!-- Modal Window -->
    <div id="checkout-modal" class="modal">
        <div class="modal-content">
            <h2>Confirm Order</h2>
            <div id="order-summary"></div>
            <div class="input-group">
                <label>Table Number:</label>
                <input type="number" id="table-number" placeholder="Enter table number">
            </div>
            <div class="modal-actions">
                <button class="btn-secondary" onclick="closeModal()">Back</button>
                <button class="btn-primary" onclick="submitOrder()">Send Order</button>
            </div>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
